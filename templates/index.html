<!DOCTYPE html>
<html lang="en">
<head><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-900 text-white p-4">
    <h1 class="text-3xl font-bold mb-4">Ashwas AI 2.0</h1>
    <button onclick="triggerSupport()" class="bg-red-600 w-full py-4 rounded-xl mb-6">🚨 Panic Beacon</button>
    <div id="response" class="bg-slate-800 p-4 rounded-lg hidden mb-6"></div>
    <input id="msg" class="w-full p-2 text-black" placeholder="Message...">
    <button onclick="sendChat()" class="w-full bg-teal-600 mt-2 py-2">Send</button>
    <div id="chatbox" class="h-64 mt-4 bg-slate-800 p-4 rounded-lg"></div>
    <script>
        async function triggerSupport() {
            const res = await fetch('/api/emergency-script', {method:'POST', body: JSON.stringify({scenario: "panic"})});
            const data = await res.json();
            const el = document.getElementById('response');
            el.innerText = data.response; el.classList.remove('hidden');
        }
        async function sendChat() {
            const msg = document.getElementById('msg').value;
            const res = await fetch('/api/chat', {method:'POST', body: JSON.stringify({message: msg})});
            const data = await res.json();
            document.getElementById('chatbox').innerHTML += '<p>AI: '+data.response+'</p>';
        }
    </script>
</body>
</html>
